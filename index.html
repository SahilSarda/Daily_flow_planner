<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="app-brand">Daily Flow</div>

        <header>
            <div class="header-top">
                <div class="greeting">
                    <span class="sub-text">Welcome back,</span>
                    <h1 id="userNameDisplay">User</h1>
                </div>
                
                <div class="header-actions">
                    <button id="statsBtn" class="icon-btn" aria-label="Statistics">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>
                    </button>
                    <button id="reminderBtn" class="icon-btn" aria-label="Reminders">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </button>
                    <button id="settingsBtn" class="icon-btn" aria-label="Settings">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="date-nav">
                <button id="prevBtn" class="nav-arrow">←</button>
                <div id="dateDisplayContainer" class="date-stack">
                    <span id="dateBig" class="date-big">--</span>
                    <span id="daySmall" class="day-small">Loading...</span>
                </div>
                <button id="nextBtn" class="nav-arrow">→</button>
            </div>
            
            <p id="quoteDisplay" class="quote-style">Loading inspiration...</p>
        </header>

        <section class="block">
            <h3 class="section-title">Daily Habits</h3>
            <div id="habit-list" class="habit-list"></div>
        </section>

        <section class="block">
            <h3 class="section-title">Reflections</h3>
            <textarea id="daily-journal" placeholder="Clear your mind..."></textarea>
        </section>

        <section class="block">
            <h3 class="section-title">Schedule</h3>
            <div class="gcal-container">
                <div id="time-slots" class="gcal-grid"></div>
            </div>
        </section>
    </div>

    <div id="statsModal" class="modal">
        <div class="modal-content stats-content">
            <div class="modal-header">
                <h2>Your Journey</h2>
                <button id="closeStats" class="close-btn">&times;</button>
            </div>
            
            <div class="stats-summary">
                <div class="stat-box">
                    <span id="streakCount" class="stat-number">0</span>
                    <span class="stat-label">Day Streak</span>
                </div>
                <div class="stat-box">
                    <span id="totalHabitsCount" class="stat-number">0</span>
                    <span class="stat-label">Habits Done</span>
                </div>
            </div>

            <div class="heatmap-container">
                <div class="heatmap-title">Yearly Consistency</div>
                <div id="heatmapGrid" class="heatmap-grid"></div>
                <div class="heatmap-legend">
                    <span>Less</span>
                    <div class="legend-box" data-level="0"></div>
                    <div class="legend-box" data-level="1"></div>
                    <div class="legend-box" data-level="2"></div>
                    <div class="legend-box" data-level="3"></div>
                    <div class="legend-box" data-level="4"></div>
                    <span>More</span>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Personalize</h2>
            </div>
            
            <div class="setting-group">
                <label>Your Name</label>
                <input type="text" id="nameInput" placeholder="Enter your name">
            </div>

            <div class="setting-group">
                <label>Theme Color</label>
                <div class="color-options">
                    <div class="color-circle" style="background:#E3E8EF" data-color="#4A5568" data-tint="#F0F4F8"></div>
                    <div class="color-circle" style="background:#E8F5E9" data-color="#2F855A" data-tint="#F1F8E9"></div>
                    <div class="color-circle" style="background:#FFF3E0" data-color="#C05621" data-tint="#FFF8E1"></div>
                    <div class="color-circle" style="background:#F3E5F5" data-color="#805AD5" data-tint="#FAF5FF"></div>
                </div>
            </div>

            <div class="setting-group">
                <label>Manage Habits</label>
                <div class="add-habit-box">
                    <input type="text" id="newHabitInput" placeholder="New habit...">
                    <button id="addHabitBtn">+</button>
                </div>
                <ul id="settingsHabitList"></ul>
            </div>

            <button id="saveSettingsBtn" class="save-btn">Let's Go</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
